<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Register an account on UserHub - Enterprise User Management System" />
  <title>Register — UserHub Admin Portal</title>
  
  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-ambient-bg"></div>

    <!-- Theme Toggle Floating Button -->
    <div style="position: absolute; top: 1.5rem; right: 1.5rem; z-index: 20;">
      <button class="theme-toggle-btn" title="Toggle Light/Dark Theme" aria-label="Toggle Theme">
        <i class="fa-solid fa-moon"></i>
      </button>
    </div>

    <!-- Auth Card -->
    <div class="auth-card" style="max-width: 480px;">
      <div class="auth-header">
        <div class="auth-brand">
          <div class="brand-icon">
            <i class="fa-solid fa-users-gear"></i>
          </div>
          <span>UserHub</span>
        </div>
        <h1 class="auth-title">Create an Account</h1>
        <p class="auth-subtitle">Join UserHub management system in seconds</p>
      </div>

      <!-- Registration Form -->
      <form id="registerForm" class="auth-form" novalidate>
        <!-- Full Name -->
        <div class="form-group">
          <label class="form-label" for="regName">Full Name <span class="required">*</span></label>
          <input
            type="text"
            id="regName"
            class="form-control"
            placeholder="Jane Doe"
            required
            autocomplete="name"
          />
          <span class="form-error-msg" id="nameError">Full name must be at least 2 characters long.</span>
        </div>

        <!-- Email Address -->
        <div class="form-group">
          <label class="form-label" for="regEmail">Email Address <span class="required">*</span></label>
          <input
            type="email"
            id="regEmail"
            class="form-control"
            placeholder="jane.doe@company.com"
            required
            autocomplete="email"
          />
          <span class="form-error-msg" id="emailError">Please enter a valid email address.</span>
        </div>

        <div class="form-grid-2">
          <!-- Department -->
          <div class="form-group">
            <label class="form-label" for="regDepartment">Department</label>
            <select id="regDepartment" class="form-control">
              <option value="Engineering">Engineering</option>
              <option value="Product Design">Product Design</option>
              <option value="Marketing">Marketing</option>
              <option value="Human Resources">Human Resources</option>
              <option value="Customer Support">Customer Support</option>
              <option value="Finance">Finance</option>
              <option value="General" selected>General</option>
            </select>
          </div>

          <!-- Phone -->
          <div class="form-group">
            <label class="form-label" for="regPhone">Phone Number</label>
            <input
              type="tel"
              id="regPhone"
              class="form-control"
              placeholder="+1 (555) 000-0000"
              autocomplete="tel"
            />
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label" for="regPassword">Password <span class="required">*</span></label>
          <div class="password-input-wrapper">
            <input
              type="password"
              id="regPassword"
              class="form-control"
              placeholder="At least 6 characters"
              required
              autocomplete="new-password"
            />
            <button type="button" class="password-toggle-btn" id="toggleRegPasswordBtn" aria-label="Toggle password visibility">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
          <span class="form-error-msg" id="passwordError">Password must be at least 6 characters long.</span>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label class="form-label" for="regConfirmPassword">Confirm Password <span class="required">*</span></label>
          <input
            type="password"
            id="regConfirmPassword"
            class="form-control"
            placeholder="Repeat your password"
            required
            autocomplete="new-password"
          />
          <span class="form-error-msg" id="confirmError">Passwords do not match.</span>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitRegBtn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.75rem;">
          <i class="fa-solid fa-user-plus"></i>
          <span id="regBtnText">Create UserHub Account</span>
        </button>
      </form>

      <div class="auth-footer">
        Already have an account?
        <a href="login.html" style="font-weight: 700;">Sign in here</a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Redirect if logged in
      window.UserHubAuth.redirectIfLoggedIn();

      // Password visibility toggle
      const passwordInput = document.getElementById('regPassword');
      const toggleRegPasswordBtn = document.getElementById('toggleRegPasswordBtn');
      toggleRegPasswordBtn.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        toggleRegPasswordBtn.innerHTML = isPassword
          ? '<i class="fa-regular fa-eye-slash"></i>'
          : '<i class="fa-regular fa-eye"></i>';
      });

      // Form submission
      const form = document.getElementById('registerForm');
      const nameInput = document.getElementById('regName');
      const emailInput = document.getElementById('regEmail');
      const deptInput = document.getElementById('regDepartment');
      const phoneInput = document.getElementById('regPhone');
      const confirmInput = document.getElementById('regConfirmPassword');

      const nameError = document.getElementById('nameError');
      const emailError = document.getElementById('emailError');
      const passwordError = document.getElementById('passwordError');
      const confirmError = document.getElementById('confirmError');

      const submitBtn = document.getElementById('submitRegBtn');
      const regBtnText = document.getElementById('regBtnText');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Clear previous errors
        [nameInput, emailInput, passwordInput, confirmInput].forEach((el) =>
          el.classList.remove('error')
        );
        [nameError, emailError, passwordError, confirmError].forEach((el) =>
          el.classList.remove('visible')
        );

        let isValid = true;
        const name = nameInput.value.trim();
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        const confirmPassword = confirmInput.value;
        const department = deptInput.value;
        const phone = phoneInput.value.trim();

        if (!name || name.length < 2) {
          nameInput.classList.add('error');
          nameError.classList.add('visible');
          isValid = false;
        }

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!email || !emailRegex.test(email)) {
          emailInput.classList.add('error');
          emailError.classList.add('visible');
          isValid = false;
        }

        if (!password || password.length < 6) {
          passwordInput.classList.add('error');
          passwordError.classList.add('visible');
          isValid = false;
        }

        if (password !== confirmPassword) {
          confirmInput.classList.add('error');
          confirmError.classList.add('visible');
          isValid = false;
        }

        if (!isValid) return;

        // Loading state
        submitBtn.disabled = true;
        regBtnText.textContent = 'Creating Account...';
        const origIcon = submitBtn.querySelector('i');
        origIcon.className = 'fa-solid fa-spinner fa-spin';

        try {
          const res = await window.UserHubAPI.AuthAPI.register({
            name,
            email,
            password,
            department,
            phone,
          });

          if (res.success && res.token) {
            localStorage.setItem('userhub_token', res.token);
            localStorage.setItem('userhub_user', JSON.stringify(res.user));

            window.UserHubAuth.showToast(
              'Account Created!',
              `Welcome to UserHub, ${res.user.name}! Taking you to your dashboard...`,
              'success',
              2500
            );

            setTimeout(() => {
              window.location.href = 'index.html';
            }, 1200);
          } else {
            throw new Error(res.message || 'Registration failed.');
          }
        } catch (err) {
          console.error('Registration error:', err);
          window.UserHubAuth.showToast(
            'Registration Failed',
            err.message || 'Could not register user. Please try again.',
            'error',
            5000
          );
        } finally {
          submitBtn.disabled = false;
          regBtnText.textContent = 'Create UserHub Account';
          origIcon.className = 'fa-solid fa-user-plus';
        }
      });
    });
  </script>
</body>
</html>
